<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5ef">
  <title>语音对话 · OpenVoiceChat</title>
  <link rel="stylesheet" href="/assets/voice.css?v=1.2.0">
  <script src="/assets/i18n.js?v=1.0.0" defer></script>
  <script src="/assets/voice.js?v=1.2.0" defer></script>
</head>
<body>
  <div class="page">
    <aside class="character-rail" aria-label="角色立绘">
      <img data-avatar src="/assets/img/chinatsu.png" alt="千夏全身立绘">
    </aside>

    <main class="shell">
    <header class="topbar">
      <div class="wordmark">
        <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        OpenVoiceChat
      </div>
      <p class="session-state" id="session-state" data-state="connecting" role="status">
        <span class="state-dot" aria-hidden="true"></span><span id="state-label">正在连接</span>
      </p>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <figure class="character-stage">
        <img data-avatar src="/assets/img/chinatsu.png" alt="千夏全身立绘">
      </figure>
      <div class="intro-content">
        <div>
          <h1 id="page-title">语音对话 · <span id="char-name-display">千夏</span></h1>
          <p id="page-desc">支持免提扬声器播放与回声抑制，无需佩戴耳机即可流畅对话。</p>
          <div class="character-select-row">
            <label for="char-select">角色设定:
              <select id="char-select">
                <option value="mio">千夏 (表妹恋人)</option>
              </select>
            </label>
            <label for="tts-engine-select">语音引擎:
              <select id="tts-engine-select">
                <option value="gpt_sovits" selected>AiServer GPT-SoVITS</option>
                <option value="cosyvoice">阿里云 CosyVoice</option>
              </select>
            </label>
            <label for="voice-select">音色:
              <select id="voice-select">
                <option value="chinatsu" selected>千夏 (chinatsu)</option>
                <option value="ling">铃 (ling)</option>
                <option value="zhe">哲 (zhe)</option>
                <option value="nangongyu">南宫羽 (nangongyu)</option>
                <option value="remielle">雷米埃尔 (remielle)</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <button id="toggle" type="button" disabled>
        <span id="toggle-icon" class="control-icon" aria-hidden="true"></span>
        <span id="toggle-label" data-i18n="start_chat"></span>
      </button>
    </section>
    <p class="alert" id="alert" role="alert" hidden></p>

    <section class="panel audio-devices" aria-label="音频设备">
      <label for="audio-input">麦克风
        <select id="audio-input" disabled><option>正在识别设备</option></select>
      </label>
      <label for="audio-output">声音输出
        <select id="audio-output" disabled><option>正在识别设备</option></select>
      </label>
      <button class="refresh" id="refresh-devices" type="button" disabled>刷新设备</button>
      <div class="speaker-mode">
        <label for="voice-mode">对话模式
          <select id="voice-mode">
            <option value="speaker" selected>扬声器防回声（推荐免提 · 绝不误断）</option>
            <option value="barge_in">智能免提打断（千夏说话时可开口打断）</option>
          </select>
        </label>
        <span id="speaker-mode-hint">千夏播放时自动暂停麦克风，播完秒开，彻底杜绝回声打断</span>
      </div>
      <p id="device-note" role="status" hidden></p>
    </section>

    <div class="workspace">
      <aside class="panel history-panel" aria-labelledby="history-title">
        <header class="panel-header history-header">
          <h2 id="history-title"><span data-i18n="history_title"></span></h2>
          <button class="new-chat" id="new-conversation" type="button" data-i18n="new_chat"></button>
        </header>
        <div class="history-list" id="history-list" data-i18n-aria-label="history_title">
          <p class="history-empty" data-i18n="loading_history"></p>
        </div>
      </aside>

      <section class="panel dialogue" aria-labelledby="dialogue-title">
        <header class="panel-header">
          <h2 id="dialogue-title">对话记录</h2>
          <span id="turn-state" class="turn-state" role="status"></span>
        </header>
        <div class="scroll" id="scroll" tabindex="0" aria-label="对话字幕">
          <div class="empty" id="empty">
            <span class="wave empty-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            <p id="empty-title">还没有对话</p>
            <p id="empty-hint">点击开始对话，说一句试试。</p>
          </div>
          <div class="messages" id="messages"></div>
        </div>
        <footer class="panel-footer" id="mic-hint">免提监听中，千夏说话时可随时开口打断。</footer>
      </section>

      <aside class="panel timings" aria-labelledby="timing-title">
        <header class="panel-header"><h2 id="timing-title">本轮耗时</h2></header>
        <dl class="timing-list">
          <div class="metric" id="asr-row">
            <dt><span>ASR</span> 语音识别</dt>
            <dd id="asr">—</dd>
            <dd class="metric-hint">判停到最终转写</dd>
          </div>
          <div class="metric" id="llm-row">
            <dt><span>LLM</span> 生成首段</dt>
            <dd id="llm">—</dd>
            <dd class="metric-hint" id="llm-sub">DeepSeek Flash</dd>
          </div>
          <div class="metric" id="tts-row">
            <dt><span>TTS</span> 合成首段</dt>
            <dd id="tts">—</dd>
            <dd class="metric-hint">GPT-SoVITS · 千夏</dd>
          </div>
        </dl>
      </aside>
    </div>
    </main>
  </div>
</body>
</html>
